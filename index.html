<style>
  :root {
    --bg: #14161a; --card: #1d2026; --line: #2d323b; --txt: #e8eaee; --mut: #9097a3;
    --acc: #4f8cff; --ok: #3ecf8e; --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt);
         font: 16px/1.45 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 20px 60px; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .logo { width: 64px; height: 64px; flex: none; filter: drop-shadow(0 4px 10px rgba(0,0,0,.35)); }
  h1 { font-size: 26px; margin: 0 0 2px; }
  .lang { margin-left: auto; align-self: flex-start; width: auto; padding: 6px 8px; font-size: 13px; }
  p.sub { color: var(--mut); margin: 0; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  label { display: block; font-size: 13px; color: var(--mut); margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  input[type=text], select {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: #12141a; color: var(--txt); font: inherit;
  }
  input:focus, select:focus { outline: 2px solid var(--acc); outline-offset: -1px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 16px; color: var(--txt); font-size: 14px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 0; padding: 11px 16px; }
  #go { width: 100%; margin-top: 20px; background: var(--acc); color: #fff; font-weight: 600; }
  #go:disabled { opacity: .5; cursor: not-allowed; }
  .sec { background: transparent; border: 1px solid var(--line); color: var(--txt); }
  #status { margin-top: 20px; display: none; }
  .bar { height: 8px; background: #12141a; border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
  .bar > div { height: 100%; width: 0; background: var(--acc); transition: width .3s; }
  .bar.indet > div { width: 40%; animation: slide 1.1s infinite ease-in-out; }
  @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  #msg { margin: 10px 0 0; font-size: 14px; white-space: pre-wrap; }
  #msg.err { color: var(--err); }
  #msg.ok { color: var(--ok); }
  #info { margin: 6px 0 0; font-size: 13px; color: var(--mut); }
  #info.warn { color: #ffb454; }
  #log { margin: 4px 0 0; font: 12px/1.4 Consolas, monospace; color: var(--mut);
         word-break: break-all; min-height: 1.4em; }
  .actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .actions a { text-decoration: none; background: var(--ok); color: #06210f; font-weight: 600;
               padding: 11px 16px; border-radius: 8px; }
  small { color: var(--mut); display: block; margin-top: 6px; font-size: 12px; }
</style>
</head>

<main>

  </g>
  <rect x="12" y="12" width="488" height="488" rx="112" fill="none" stroke="#dfe3ea" stroke-width="4"/>
</svg>

    <div>
      <h1>Cutito</h1>
      <p class="sub" data-i="sub"></p>
    </div>
  <select id="lang" class="lang" aria-label="Language"></select>
  </div>

  <div class="card">
    <label for="url" data-i="url"></label>
    <input id="url" type="text" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">

    <div class="row">
      <div>
        <label for="start" data-i="start"></label>
        <input id="start" type="text" data-ph="start_ph">
      </div>
      <div>
        <label for="end" data-i="end"></label>
        <input id="end" type="text" data-ph="end_ph">
      </div>
    </div>
    <small data-i="hint"></small>

    <div class="row">
      <div>
        <label for="height" data-i="res"></label>
        <select id="height">
          <option value="480">480p</option>
          <option value="720" selected data-i="res_rec"></option>
          <option value="1080">1080p</option>
        </select>
      </div>
      <div>
        <label for="crf" data-i="crf"></label>
        <select id="crf">
          <option value="23" data-i="crf_hi"></option>
          <option value="26" selected data-i="crf_mid"></option>
          <option value="30" data-i="crf_lo"></option>
        </select>
      </div>
    </div>

    <label for="name" data-i="name"></label>
    <input id="name" type="text" data-ph="name_ph">

    <label class="check"><input id="audio" type="checkbox"> <span data-i="audio"></span></label>

    <button id="go" data-i="go"></button>

    <div id="status">
      <div class="bar" id="bar"><div></div></div>
      <p id="msg"></p>
      <p id="info"></p>
      <p id="log"></p>
      <div class="actions" id="actions"></div>
    </div>
  </div>
</main>

function pickLang() {
  try { const s = localStorage.getItem("cutito_lang"); if (s && I18N[s]) return s; } catch (e) {}
  return "en";  // English by default; the choice is remembered
}
let LANG = pickLang();
function t(k, v) {
  let s = (I18N[LANG][k] ?? I18N.en[k] ?? k);
  for (const x in (v || {})) s = s.split("{" + x + "}").join(v[x]);
  return s;
}
// server message -> chosen language (if it has a code), otherwise the original text
function srv(j) { return j.code && I18N.en[j.code] ? t(j.code, { arg: j.arg || "" }) : (j.msg || j.error || t("unknown_error")); }
function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i]").forEach(e => { e.textContent = t(e.dataset.i); });
  document.querySelectorAll("[data-ph]").forEach(e => { e.placeholder = t(e.dataset.ph); });
  $("lang").value = LANG;
  const a = document.querySelector("#actions a"), o = $("open");
  if (a) a.textContent = t("dl_mp4");
  if (o) o.textContent = t("open_folder");
}

(function () {
  const sel = $("lang");
  for (const k in I18N) { const o = document.createElement("option"); o.value = k; o.textContent = I18N[k]._name; sel.appendChild(o); }
  sel.addEventListener("change", () => { LANG = sel.value; try { localStorage.setItem("cutito_lang", LANG); } catch (e) {} applyLang(); });
})();
const H = { "Content-Type": "application/json", "X-Cutito": "1" };
let timer = null;
let lastKey = "", lastChange = Date.now();

// --- Link with the app: while the window is open it sends a "heartbeat".
// When the window is closed, the app is notified (and shuts down if it is idle).
const TOKEN = "__TOKEN__";
const CID = Math.random().toString(36).slice(2) + Date.now().toString(36);
function ping() { fetch("/api/ping?c=" + CID, { method: "POST", headers: H }).catch(() => {}); }
ping();
setInterval(ping, 3000);
window.addEventListener("pageshow", ping);
window.addEventListener("pagehide", () => {
  try { navigator.sendBeacon("/api/bye?t=" + TOKEN + "&c=" + CID); } catch (e) {}
});

function fmtTime(s) {
  const m = Math.floor(s / 60), r = s % 60;
  return m + ":" + String(r).padStart(2, "0");
}

function setMsg(text, cls) { const m = $("msg"); m.textContent = text; m.className = cls || ""; }

function setBar(pct) {
  const bar = $("bar");
  if (pct === null || pct === undefined) { bar.classList.add("indet"); return; }
  bar.classList.remove("indet");
  bar.firstElementChild.style.width = pct + "%";
}

$("go").addEventListener("click", async () => {
  $("status").style.display = "block";
  $("actions").innerHTML = "";
  setBar(0); setMsg(t("starting"));
  $("info").textContent = ""; $("info").className = ""; $("log").textContent = "";
  lastKey = ""; lastChange = Date.now();
  $("go").disabled = true;

  const body = {
    url: $("url").value, start: $("start").value, end: $("end").value,
    height: $("height").value, crf: $("crf").value,
    audio: $("audio").checked, name: $("name").value,
  };

  try {
    const r = await fetch("/api/start", { method: "POST", headers: H, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) throw new Error(srv(j));
    poll(j.id);
  } catch (e) {
    setMsg(e.message, "err"); $("go").disabled = false;
  }
});

function poll(id) {
  clearInterval(timer);
  timer = setInterval(async () => {
    try {
      const r = await fetch("/api/status/" + id, { headers: H });
      const j = await r.json();
      if (j.stage === "error") {
        clearInterval(timer); setBar(0); setMsg(srv(j), "err"); $("go").disabled = false; return;
      }
      if (j.stage === "done") {
        clearInterval(timer); setBar(100);
        setMsg(t("done", { file: j.filename, mb: j.size_mb }), "ok");
        $("actions").innerHTML =
          '<a href="/api/file/' + id + '">' + t("dl_mp4") + '</a>' +
          '<button class="sec" id="open">' + t("open_folder") + '</button>';
        $("open").onclick = () => fetch("/api/open-folder", { method: "POST", headers: H });
        $("go").disabled = false; return;
      }
      // Animated bar when there is no real percentage (e.g. download with cutting)
      const hasPct = j.progress !== null && j.progress !== undefined && j.progress > 0;
      setBar(hasPct ? j.progress : null);
      setMsg(srv(j) + (hasPct ? " " + Math.round(j.progress) + "%" : ""));

      // What changes between checks? If nothing for a while, say so.
      const key = [j.bytes_mb, j.progress, j.last_line].join("|");
      if (key !== lastKey) { lastKey = key; lastChange = Date.now(); }
      const still = Math.round((Date.now() - lastChange) / 1000);

      let info = t("elapsed", { t: fmtTime(j.elapsed) });
      if (j.eta !== null && j.eta !== undefined) info += " · " + t("eta", { t: fmtTime(j.eta) });
      else if (j.elapsed > 8) info += " · " + t("eta_na");
      if (j.speed) info += " · " + j.speed;
      if (j.stage === "download") {
        info += " · " + t("on_disk", { mb: j.bytes_mb });
        if (j.track >= 2) info += " · " + t("track", { n: j.track });
      }
      if (still > 45) info += " · " + t("no_change", { s: still });
      $("info").textContent = info;
      $("info").className = still > 45 ? "warn" : "";
      $("log").textContent = j.last_line || "";
    } catch (e) {
      clearInterval(timer); setMsg(t("lost"), "err");
      $("go").disabled = false;
    }
  }, 1000);
}
applyLang();
</script>
